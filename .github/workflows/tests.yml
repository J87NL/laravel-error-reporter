name: Tests
on:
  push:
    branches: main
  pull_request:
jobs:
  test:
    name: Pest (Laravel ${{ matrix.laravel }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        laravel:
          - 12
          - 13
    steps:
      - uses: actions/checkout@v7
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.5
          extensions: mbstring, pdo_sqlite
          coverage: none
      - name: Composer install
        run: composer update --no-interaction --prefer-dist --ansi --with "laravel/framework:^${{ matrix.laravel }}.0"
      - name: Test
        run: vendor/bin/pest
  browser:
    name: Browser script (Node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Test
        run: node --test 'tests/js/*.test.ts'
