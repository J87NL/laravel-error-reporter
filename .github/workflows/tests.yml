name: Tests
on:
  push:
    branches: main
  pull_request:
jobs:
  test:
    name: Pest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.5
          extensions: mbstring, pdo_sqlite
          coverage: none
      - name: Composer install
        run: composer update --no-interaction --prefer-dist --ansi
      - name: Test
        run: vendor/bin/pest
